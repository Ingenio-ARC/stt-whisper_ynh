app:
  port: __PORT__
  host: "127.0.0.1"
  max_file_size_mb: __MAX_FILE_SIZE_MB__
  log_level: info
  temp_dir: "/var/cache/__APP__"
  workers: 1

security:
  api_key: "__API_KEY__"
  allowed_ips: "__ALLOWED_IPS__"

whisper:
  binary_path: "/var/www/__APP__/whisper/main"
  model_path: "/var/www/__APP__/models/__MODEL_FILE__"
  language: "__LANGUAGE__"
  threads: __THREADS__
  beam_size: __BEAM_SIZE__

  # Audios breves e independientes: sin contexto entre segmentos
  # (evita repeticiones/alucinaciones en bucle en clips cortos)
  max_context: 0
  # Prompt inicial que sesga vocabulario y formato (homofonos/numeros hablados
  # en espanol: "ocho y media" -> "8:30", etc.). Editalo al negocio si quieres.
  initial_prompt: "Horarios de citas: ocho y media, 8:30, nueve y cuarto, 9:15, diez en punto"
  # Confianza media (exp(mean plog), 0-1) por debajo de este valor => low_confidence
  confidence_threshold: 0.60

preprocessing:
  denoise: false
